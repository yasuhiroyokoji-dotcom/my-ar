<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro">
        <a-entity position="0 0.5 0" rotation="0 45 0" animation="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 1000">
          <a-box position="0 0 0" scale="0.6 0.4 1" color="#8B4513"></a-box>
          <a-box position="0 0.3 0.4" scale="0.2 0.6 0.3" color="#8B4513"></a-box>
          <a-box position="0 0.5 0.6" scale="0.25 0.25 0.4" color="#8B4513"></a-box>
          <a-box position="0.2 -0.3 0.3" scale="0.1 0.4 0.1" color="#000000"></a-box>
          <a-box position="-0.2 -0.3 0.3" scale="0.1 0.4 0.1" color="#000000"></a-box>
          <a-box position="0.2 -0.3 -0.3" scale="0.1 0.4 0.1" color="#000000"></a-box>
          <a-box position="-0.2 -0.3 -0.3" scale="0.1 0.4 0.1" color="#000000"></a-box>
        </a-entity>
        
        <a-text id="result-text" value="HAPPY 2026" position="0 1.5 0" align="center" color="#FFD700" scale="1.5 1.5 1.5"></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('touchstart', function () {
        const results = ["DAIKICHI", "CHUKICHI", "KICHI", "UMA"];
        const random = results[Math.floor(Math.random() * results.length)];
        document.querySelector('#result-text').setAttribute('value', random);
      });
    </script>
  </body>
</html>
