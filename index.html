<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <canvas id="emojiCanvas" width="256" height="256" style="display:none;"></canvas>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 15;">
      
      <a-marker preset="hiro">
        <a-entity position="0 0.4 0" rotation="0 45 0" animation="property: position; to: 0 0.5 0; dir: alternate; loop: true; dur: 1200">
          <a-box position="0 0 0" scale="0.4 0.4 0.8" color="#8B4513"></a-box>
          <a-box position="0 0.4 0.35" rotation="-20 0 0" scale="0.15 0.5 0.2" color="#8B4513"></a-box>
          <a-box position="0 0.6 0.5" scale="0.2 0.2 0.35" color="#8B4513"></a-box>
          <a-box position="0.15 -0.4 0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="-0.15 -0.4 0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="0.15 -0.4 -0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="-0.15 -0.4 -0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
        </a-entity>
        
        <a-text id="result-text" value="おみくじを引く" position="0 1.5 0" align="center" color="#FFD700" scale="1.2 1.2 1.2"
                font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/notosansjp/NotoSansJP-Medium.json"
                shader="msdf"></a-text>

        <a-plane id="emoji-plane" position="0 1.9 0" rotation="-90 0 0" scale="0.5 0.5 0.5"
                 material="src: #emojiCanvas; transparent: true; opacity: 1;"></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // 絵文字を描く関数
      function drawEmoji(emoji) {
        const canvas = document.getElementById('emojiCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "200px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(emoji, canvas.width / 2, canvas.height / 2);
        
        const plane = document.querySelector('#emoji-plane');
        if(plane.getObject3D('mesh')) {
          plane.getObject3D('mesh').material.map.needsUpdate = true;
        }
      }

      // 初期の馬絵文字
      window.onload = () => { drawEmoji("🐎"); };

      // タップイベント
      window.addEventListener('touchstart', function () {
        const results = [
          {txt: "大吉", emo: "🌅"},
          {txt: "中吉", emo: "🎍"},
          {txt: "小吉", emo: "🥕"},
          {txt: "吉", emo: "✨"},
          {txt: "あけおめ", emo: "🧧"}
        ];
        const res = results[Math.floor(Math.random() * results.length)];
        
        document.querySelector('#result-text').setAttribute('value', res.txt);
        drawEmoji(res.emo);
      });
    </script>
  </body>
</html>
