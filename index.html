<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <a-text value="🐎" position="0 0.5 0" align="center" scale="10 10 10" rotation="-90 0 0"
                animation="property: position; to: 0 0.8 0; dir: alternate; loop: true; dur: 1000">
        </a-text>
        
        <a-text id="result-text" value="TAP TO START" position="0 1.2 0" align="center" color="#FFD700" scale="1.2 1.2 1.2"></a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('touchstart', function () {
        const results = ["DAIKICHI 🐎", "CHUKICHI 🥕", "KICHI ✨"];
        const random = results[Math.floor(Math.random() * results.length)];
        document.querySelector('#result-text').setAttribute('value', random);
      });
    </script>
  </body>
</html>
