<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 15;">
      
      <a-marker preset="hiro">
        <a-entity position="0 0.5 0" rotation="0 45 0" animation="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 1200">
          <a-box position="0 0 0" scale="0.4 0.4 0.8" color="#8B4513"></a-box>
          <a-box position="0 0.4 0.35" rotation="-20 0 0" scale="0.15 0.5 0.2" color="#8B4513"></a-box>
          <a-box position="0 0.6 0.5" scale="0.2 0.2 0.35" color="#8B4513"></a-box>
          <a-box position="0.15 -0.4 0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="-0.15 -0.4 0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="0.15 -0.4 -0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="-0.15 -0.4 -0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="0 -0.1 -0.45" rotation="-30 0 0" scale="0.05 0.3 0.05" color="#555"></a-box>
        </a-entity>
        
        <a-text id="result-text" 
                value="画面をタップ！" 
                position="0 1.8 0" 
                align="center" 
                color="#FFD700" 
                scale="1.5 1.5 1.5"
                font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/notosansjp/NotoSansJP-Medium.json"
                shader="msdf">
        </a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('touchstart', function () {
        // 【修正ポイント】ここを日本語に書き換えました！
        const results = ["大吉 🐎", "中吉 🥕", "小吉 ☁️", "お年玉！", "あけおめ"];
        const random = results[Math.floor(Math.random() * results.length)];
        const textEl = document.querySelector('#result-text');
        if (textEl) textEl.setAttribute('value', random);
      });
    </script>
  </body>
</html>
