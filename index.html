<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <canvas id="emojiCanvas" width="256" height="256" style="display:none;"></canvas>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <a-plane id="emoji-plane" position="0 0.5 0" rotation="-90 0 0" scale="1.5 1.5 1.5"
                 material="src: #emojiCanvas; transparent: true;"></a-plane>

        <a-text id="result-text" value="TAP TO START" position="0 1.5 0" align="center" color="#FFD700"
                font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/notosansjp/NotoSansJP-Medium.json"
                shader="msdf"></a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // 絵文字をキャンバスに描く関数
      function drawEmoji(emoji) {
        const canvas = document.getElementById('emojiCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height); // 一度消す
        ctx.font = "200px serif"; // 大きさを指定
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(emoji, canvas.width / 2, canvas.height / 2); // 絵文字を描く
        
        // AR側の板に「描き直したよ」と教える
        const plane = document.querySelector('#emoji-plane');
        if(plane.getObject3D('mesh')) {
          plane.getObject3D('mesh').material.map.needsUpdate = true;
        }
      }

      // 最初は馬を表示
      window.onload = () => { drawEmoji("🐎"); };

      // タップでおみくじ
      window.addEventListener('touchstart', function () {
        const items = [
          {txt: "大吉", emo: "🎍"},
          {txt: "中吉", emo: "🥕"},
          {txt: "小吉", emo: "☁️"},
          {txt: "神回", emo: "✨"}
        ];
        const res = items[Math.floor(Math.random() * items.length)];
        
        document.querySelector('#result-text').setAttribute('value', res.txt);
        drawEmoji(res.emo); // 絵文字を書き換える
      });
    </script>
  </body>
</html>
