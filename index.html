<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <canvas id="textCanvas" width="512" height="128" style="display:none;"></canvas>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <a-entity position="0 0.4 0" rotation="0 45 0">
          <a-box position="0 0 0" scale="0.4 0.4 0.8" color="#8B4513"></a-box>
          <a-box position="0 0.4 0.35" rotation="-20 0 0" scale="0.15 0.5 0.2" color="#8B4513"></a-box>
          <a-box position="0 0.6 0.5" scale="0.2 0.2 0.35" color="#8B4513"></a-box>
          <a-box position="0.15 -0.4 0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="-0.15 -0.4 0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="0.15 -0.4 -0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
          <a-box position="-0.15 -0.4 -0.25" scale="0.08 0.6 0.08" color="#333"></a-box>
        </a-entity>
        
        <a-plane id="msg-board" position="0 1.5 0" rotation="-90 0 0" width="2" height="0.5"
                 material="src: #textCanvas; transparent: true;"></a-plane>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // 文字を描くための手順
      function drawText(word) {
        const cvs = document.getElementById('textCanvas');
        const ctx = cvs.getContext('2d');
        
        // 画用紙を真っ白に塗ってから、文字を書く
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; // 半透明の白背景
        ctx.fillRect(0, 0, cvs.width, cvs.height);
        
        ctx.fillStyle = "#FF0000"; // 文字色は赤
        ctx.font = "bold 60px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(word, cvs.width / 2, cvs.height / 2);
        
        // 看板に「絵を更新したよ」と伝える
        const board = document.querySelector('#msg-board');
        if(board.getObject3D('mesh')) {
          board.getObject3D('mesh').material.map.needsUpdate = true;
        }
      }

      // 起動した時にまず表示
      window.onload = () => {
        setTimeout(() => { drawText("タップしてね"); }, 1000);
      };

      // タップされた時
      window.addEventListener('touchstart', function () {
        const list = ["大吉", "中吉", "小吉", "あけおめ"];
        const picked = list[Math.floor(Math.random() * list.length)];
        drawText(picked);
      });
    </script>
  </body>
</html>
