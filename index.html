<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <a-asset-item id="horse-model" src="https://raw.githubusercontent.com/nmarulo/ar-assets/main/horse.glb"></a-asset-item>
      </a-assets>
      
      <a-marker preset="hiro">
        <a-entity gltf-model="#horse-model" 
                  scale="0.015 0.015 0.015" 
                  position="0 0 0" 
                  rotation="0 0 0"
                  animation-mixer>
        </a-entity>
        
        <a-text id="result-text" value="READY" position="0 1.5 0" align="center" color="#FFD700" scale="1.2 1.2 1.2"></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('touchstart', function () {
        const results = ["DAIKICHI 🐎", "CHUKICHI 🥕", "KICHI ✨", "HAPPY NEW YEAR 🎍"];
        const random = results[Math.floor(Math.random() * results.length)];
        document.querySelector('#result-text').setAttribute('value', random);
      });
    </script>
  </body>
</html>
