<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <script>
      window.addEventListener('error', function(e) {
        alert("エラーが発生しました: " + e.message);
      });
    </script>

    <a-scene embedded arjs="debugUIEnabled: false;">
      <a-assets>
        <a-asset-item id="horse" src="https://raw.githubusercontent.com/nmarulo/ar-assets/main/horse.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-sphere position="0 0 0" radius="0.2" color="blue"></a-sphere>
        
        <a-entity gltf-model="#horse" 
                  scale="0.02 0.02 0.02" 
                  position="0 0 0" 
                  animation-mixer>
        </a-entity>
        
        <a-text id="omikuji-text" value="TAP TO START" position="0 1 1" align="center" color="#FFD700"></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      document.body.addEventListener('click', function () {
        const results = ["大吉 🐎", "中吉 🥕", "小吉 ☁️", "吉 ✨"];
        const randomResult = results[Math.floor(Math.random() * results.length)];
        document.querySelector('#omikuji-text').setAttribute('value', randomResult);
      });
    </script>
  </body>
</html>
